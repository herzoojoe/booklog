<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!--
  ==========================================================
  ✏️ 모임 정보 고치는 법 — 바로 아래 칸만 고치면 됩니다
  ==========================================================
  - <script ...> 줄과 </script> 줄 "사이"의 글만 고치세요.
  - 한 줄에 하나씩 「제목: 내용」으로 씁니다. 따옴표나 쉼표는 필요 없어요.
  - 콜론(:) 앞의 제목이 화면의 칸 제목이 됩니다.
      예) 💰 회비  →  💰 참가비 로 바꿔도 돼요. 이모지는 지워도 돼요.
  - 줄을 새로 쓰면 칸이 새로 생겨요.   예) 📚 이번 책: 데미안
  - 내용을 비우거나(예: 💰 회비:) 줄을 지우면 그 칸은 화면에서 사라져요.

  특별한 줄 세 가지 (제목을 바꾸지 마세요)
  - 모임 이름: 화면 맨 위 큰 제목 (꼭 적어 주세요)
  - 한 줄 소개: 큰 제목 아래 작은 글 (비워도 돼요)
  - 지도 링크: '장소' 칸에 '지도 보기' 버튼으로 붙어요.
      지도 앱의 [공유 → 링크 복사]로 받은 주소를 그대로 붙여 넣으세요.

  저절로 해 주는 것
  - 제목에 '연락처'나 '전화'가 들어간 칸에 전화번호가 있으면 '전화 걸기' 버튼이
    생겨요. 번호를 여러 개 쓰면 첫 번째 번호로 걸려요.
  - 날짜를 연도까지 쓰면(예: 2026년 11월 14일) 남은 날(D-3)을 보여 주고,
    모임 당일에는 '오늘 모임이 있습니다', 날짜가 지나면 '지난 모임'이라고 알려 줘요.
  - 제목에 '정기 모임'이 들어간 줄은 올해 모임 일정표가 돼요.
      예) 🗓️ 정기 모임: 매달 둘째 주 토요일
      '첫째/둘째/셋째/넷째/마지막' 과 '월~일요일'을 바꿔 쓸 수 있어요.
      지난 모임은 흐리게 보이고, '다음 모임' 날짜가 규칙과 다르면 그 달만 바꿔 보여 줘요.
  - 'Q:' 줄과 'A:' 줄을 짝지어 쓰면 페이지 맨 아래 '자주 묻는 질문'에 들어가요.
      질문을 누르면 답이 펼쳐져요. 짝을 더 쓰면 질문이 늘고, 지우면 줄어요.
      답이 길면 'A:' 줄을 여러 번 써서 문단을 나눌 수 있어요.
      코너 제목은 '❓ 자주 묻는 질문:' 줄에서 이모지나 앞뒤 말을 바꿀 수 있어요.
      (단, '자주 묻는 질문' 글자는 남겨 두세요. 예: 💬 자주 묻는 질문 모음:)
  - 잘못 쓴 줄이 있으면 페이지 맨 위에 노란 안내가 떠요.

  저장한 뒤에는
  - master 브랜치에 저장해야 인터넷 주소에 반영돼요.
  - 반영까지 1~2분 걸려요. 기다렸다가 새로고침하세요.
  ==========================================================
-->
<script type="text/plain" id="meeting">
모임 이름: 동네 독서모임
한 줄 소개: 한 달에 한 번, 같은 책을 읽고 이야기 나눠요.
📅 다음 모임: 2026년 11월 10일 (화) 오후 2시
📍 장소: 삼죽면 작은도서관(2층) 회의실
지도 링크: https://m.place.naver.com/place/1134612895/location?filter=location&selected_place_id=1134612895
💰 회비: 1인 5,000원 (다과비)
📞 연락처: 010-1234-5678
🗓️ 정기 모임: 매달 둘째 주 화요일

❓ 자주 묻는 질문:
Q: 처음 와도 되나요?
A: 네, 언제든 환영해요. 연락처로 미리 알려 주시면 자리를 준비해 둘게요.
Q: 회비는 어떻게 내나요?
A: 모임 당일 현장에서 현금이나 계좌이체로 내시면 돼요. 회비는 다과와 장소 비용에 써요.
Q: 책을 다 못 읽었는데 가도 되나요?
A: 그럼요. 읽은 만큼만 이야기해도 괜찮고, 다른 분들 이야기를 듣기만 해도 좋아요.
Q: 다음 달 책은 어떻게 정하나요?
A: 모임이 끝날 때 다 같이 후보를 내고 골라요. 정해진 책은 단톡방에 공지해요.
Q: 주차는 가능한가요?
A: 면사무소 주차장을 이용해 주세요.
</script>

  - content="" 의 따옴표 안만 고치세요. 안에 큰따옴표(")는 쓰지 마세요.
  - 날짜는 자주 바뀌니 여기엔 넣지 않는 걸 추천해요.

<body>
  <div id="notice" hidden></div>

  <header>
    <h1 id="name">모임 안내</h1>
    <p id="intro" hidden></p>

  <main id="cards">
    <noscript>
      <section class="item">이 페이지를 보려면 브라우저에서 자바스크립트를 켜 주세요.</section>
    </noscript>
  </main>

  <script>
    // 오래된 휴대폰에서도 돌도록 최신 문법(?? ?. 등)은 쓰지 않는다
    var problems = [];

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text; // textContent라 HTML로 해석되지 않는다
      return node;
    }

    function keyOf(title) {
      return title.replace(/\s+/g, "");
    }

    // 「제목: 내용」 줄들을 [{ title, value }] 로 읽는다 (첫 번째 콜론 기준)
    function parseLines(text) {
      var rows = [];
      text.split(/\r?\n/).forEach(function (line) {
        var trimmed = line.trim();
        if (!trimmed) return;
        var m = trimmed.match(/^([^:：]+)[:：](.*)$/);
        if (!m || !m[1].trim()) {
          problems.push("콜론(:)이 없는 줄이 있어요 → " + trimmed);
          return;
        }
        rows.push({ title: m[1].trim(), value: m[2].trim() });
      });
      return rows;
    }

    // https:// 를 빠뜨린 주소는 붙여 주고, 주소가 아니면 "" 를 돌려준다
    function normalizeUrl(raw) {
      if (/^https?:\/\/\S+$/i.test(raw)) return raw;
      if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(raw)) return "https://" + raw;
      return "";
    }

    // 글 속 첫 번째 전화번호를 숫자만 남겨 돌려준다 (없으면 "")
    function firstPhone(text) {
      var m = text.match(/(^|[^\d])(\+?\d{2,4}[-.\s]?\d{3,4}[-.\s]?\d{4}|1[5-9]\d{2}-\d{4})(?!\d)/);
      return m ? m[2].replace(/[^\d+]/g, "") : "";
    }

    // "2026년 11월 14일", "2026-11-14", "2026.11.14" 를 읽는다 (연도가 없으면 null)
    function parseDate(text) {
      var m = text.match(/(\d{4})\s*[년.\-\/]\s*(\d{1,2})\s*[월.\-\/]\s*(\d{1,2})/);
      if (!m) return null;
      var y = +m[1], mo = +m[2] - 1, d = +m[3];
      var date = new Date(y, mo, d);
      if (date.getFullYear() !== y || date.getMonth() !== mo || date.getDate() !== d) return null;
      return date;
    }

    function daysUntil(date) {
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((date - today) / 86400000);
    }

    var WEEKDAYS = "일월화수목금토";
    var ORDINALS = { "첫째": 1, "첫번째": 1, "1번째": 1, "둘째": 2, "두번째": 2, "2번째": 2,
                     "셋째": 3, "세번째": 3, "3번째": 3, "넷째": 4, "네번째": 4, "4번째": 4, "마지막": -1 };

    function formatDate(date) {
      return (date.getMonth() + 1) + "월 " + date.getDate() + "일 (" + WEEKDAYS.charAt(date.getDay()) + ")";
    }

    // "매달 둘째 주 토요일" → { nth: 2, weekday: 6 } (이해 못 하면 null)
    function parseRule(text) {
      var m = text.replace(/\s+/g, "").match(/(첫째|첫번째|1번째|둘째|두번째|2번째|셋째|세번째|3번째|넷째|네번째|4번째|마지막)주?([일월화수목금토])요일/);
      return m ? { nth: ORDINALS[m[1]], weekday: WEEKDAYS.indexOf(m[2]) } : null;
    }

    // 그 달의 n번째 요일 (nth가 -1이면 마지막 요일)
    function ruleDate(year, month, rule) {
      if (rule.nth > 0) {
        var first = new Date(year, month, 1).getDay();
        return new Date(year, month, 1 + (rule.weekday - first + 7) % 7 + (rule.nth - 1) * 7);
      }
      var last = new Date(year, month + 1, 0);
      return new Date(year, month, last.getDate() - (last.getDay() - rule.weekday + 7) % 7);
    }

    // 오늘 이후(오늘 포함) 첫 정기 모임 날짜
    function nextRuleDate(rule) {
      var now = new Date();
      for (var i = 0; i < 13; i++) {
        var date = ruleDate(now.getFullYear(), now.getMonth() + i, rule);
        if (daysUntil(date) >= 0) return date;
      }
      return null;
    }

    function dateBadge(date, rule) {
      var days = daysUntil(date);
      if (days === 0) return el("span", "badge", "오늘 모임이 있습니다");
      if (days > 0)   return el("span", "badge", "D-" + days);
      var next = rule ? nextRuleDate(rule) : null;
      if (!next) return el("span", "badge past", "지난 모임이에요 · 다음 일정은 연락처로 문의해 주세요");
      var left = daysUntil(next);
      return el("span", "badge past", "지난 모임이에요 · 다음 정기 모임은 " + formatDate(next) +
                (left === 0 ? " 오늘" : ", D-" + left));
    }

    // 올해 1~12월 정기 모임 일정표. override(다음 모임 날짜)가 있으면 그 달 날짜를 바꾼다
    function scheduleSection(row, rule, override) {
      var section = el("section", "item");
      section.appendChild(el("div", "label", row.title));
      section.appendChild(el("div", "value", row.value));

      var year = new Date().getFullYear();
      section.appendChild(el("div", "schedule-year", year + "년 모임 일정"));
      var list = el("ul", "schedule");
      var nextMarked = false;

      for (var month = 0; month < 12; month++) {
        var date = ruleDate(year, month, rule);
        var changed = false;
        if (override && override.getFullYear() === year && override.getMonth() === month &&
            override.getDate() !== date.getDate()) {
          date = override;
          changed = true;
        }

        var days = daysUntil(date);
        var notes = [];
        var li = el("li");
        if (days < 0) {
          li.className = "past";
          notes.push("지남");
        } else if (!nextMarked) {
          li.className = "next";
          notes.push(days === 0 ? "오늘" : "다음 모임 · D-" + days);
          nextMarked = true;
        }
        if (changed) notes.push("날짜 변경");

        li.appendChild(el("span", "when", formatDate(date)));
        if (notes.length) li.appendChild(el("span", "note", notes.join(" · ")));
        list.appendChild(li);
      }

      // 올해 모임이 모두 끝났으면 내년 첫 모임을 덧붙인다
      if (!nextMarked) {
        var nextYear = ruleDate(year + 1, 0, rule);
        var nextLi = el("li", "next");
        nextLi.appendChild(el("span", "when", "내년 " + formatDate(nextYear)));
        nextLi.appendChild(el("span", "note", "다음 모임 · D-" + daysUntil(nextYear)));
        list.appendChild(nextLi);
      }
      section.appendChild(list);
      return section;
    }

    // "오후 2시"가 "오후 / 2시"로 갈라지지 않게 붙인다
    function keepTimeTogether(text) {
      return text.replace(/(오전|오후|낮|저녁|밤|아침)\s+(\d)/g, "$1 $2");
    }

    function render() {
      var rows = parseLines(document.getElementById("meeting").textContent);
      var name = "", intro = "", mapRaw = "";
      var cards = [];
      var faqTitle = "❓ 자주 묻는 질문", faqs = [];

      rows.forEach(function (row) {
        var key = keyOf(row.title);
        var upper = key.toUpperCase();
        var lastFaq = faqs[faqs.length - 1];
        if (key === "모임이름")                      name = row.value;
        else if (key === "한줄소개")                 intro = row.value;
        else if (key === "지도링크" || key === "지도") mapRaw = row.value;
        else if (key.indexOf("자주묻는질문") !== -1)  faqTitle = row.title;
        else if (upper === "Q" || key === "질문") {
          if (row.value) faqs.push({ q: row.value, a: [] });
        }
        else if (upper === "A" || key === "답" || key === "답변") {
          if (!row.value) return;
          if (lastFaq) lastFaq.a.push(row.value);
          else problems.push("'Q:' 줄 없이 'A:' 줄이 먼저 나왔어요 → " + row.value);
        }
        else cards.push(row);
      });

      if (name) {
        document.getElementById("name").textContent = name;
        document.title = name;
      } else {
        problems.push("'모임 이름:' 줄에 모임 이름을 적어 주세요.");
      }
      if (intro) {
        var introEl = document.getElementById("intro");
        introEl.textContent = intro;
        introEl.hidden = false;
      }

      var mapUrl = "";
      if (mapRaw) {
        mapUrl = normalizeUrl(mapRaw);
        if (!mapUrl) problems.push("'지도 링크'가 인터넷 주소가 아니에요 → " + mapRaw);
      }

      // 정기 모임 규칙과, 일정표에 반영할 '다음 모임' 날짜를 먼저 찾아 둔다
      var rule = null, ruleRow = null, meetingDate = null;
      cards.forEach(function (row) {
        if (!ruleRow && keyOf(row.title).indexOf("정기모임") !== -1) ruleRow = row;
        else if (!meetingDate && row.value) meetingDate = parseDate(row.value);
      });
      if (ruleRow && ruleRow.value) {
        rule = parseRule(ruleRow.value);
        if (!rule) problems.push("'" + ruleRow.title + "'을 이해하지 못했어요. 예) 매달 둘째 주 토요일 → " + ruleRow.value);
      }

      var main = document.getElementById("cards");
      var mapPlaced = false, datePlaced = false;

      cards.forEach(function (row) {
        if (row === ruleRow && rule) {
          main.appendChild(scheduleSection(row, rule, meetingDate));
          return;
        }

        var key = keyOf(row.title);
        var section = el("section", "item");
        section.appendChild(el("div", "label", row.title));
        if (row.value) section.appendChild(el("div", "value", keepTimeTogether(row.value)));

        var date = !datePlaced && row !== ruleRow && row.value ? parseDate(row.value) : null;
        if (date) {
          section.appendChild(dateBadge(date, rule));
          datePlaced = true;
        }

        if (mapUrl && !mapPlaced && key.indexOf("장소") !== -1) {
          section.appendChild(link("지도 보기", mapUrl, true));
          mapPlaced = true;
        }

        if (/연락처|전화/.test(key)) {
          var phone = firstPhone(row.value);
          if (phone) section.appendChild(link("전화 걸기", "tel:" + phone, false));
        }

        // 내용도 버튼도 없는 칸은 보여 주지 않는다
        if (section.childNodes.length > 1) main.appendChild(section);
      });

      // '장소' 칸이 없으면 지도 버튼만 따로 보여 준다
      if (mapUrl && !mapPlaced) {
        var mapSection = el("section", "item");
        mapSection.appendChild(el("div", "label", "📍 지도"));
        mapSection.appendChild(link("지도 보기", mapUrl, true));
        main.appendChild(mapSection);
      }

      // 자주 묻는 질문은 항상 맨 아래. 답이 없는 질문은 빼고 안내한다
      var answered = faqs.filter(function (faq) {
        if (!faq.a.length) problems.push("'A:' 답이 없는 질문이 있어요 → " + faq.q);
        return faq.a.length > 0;
      });
      if (answered.length) main.appendChild(faqSection(faqTitle, answered));
    }

    // 질문을 누르면 답이 펼쳐진다 (<details>라 스크립트 없이 열고 닫힘)
    function faqSection(title, faqs) {
      var section = el("section", "item faq");
      section.appendChild(el("div", "label", title));
      faqs.forEach(function (faq) {
        var details = el("details");
        details.appendChild(el("summary", "", faq.q));
        faq.a.forEach(function (line) { details.appendChild(el("p", "", line)); });
        section.appendChild(details);
      });
      return section;
    }

    function link(text, href, newTab) {
      var a = el("a", "btn", text);
      a.href = href;
      if (newTab) {
        a.target = "_blank";
        a.rel = "noopener";
      }
      return a;
    }

    function showProblems() {
      if (!problems.length) return;
      var box = document.getElementById("notice");
      box.appendChild(el("strong", "", "⚠️ 관리자 확인 필요: 모임 정보 칸에 고칠 부분이 있어요."));
      var list = el("ul");
      problems.forEach(function (p) { list.appendChild(el("li", "", p)); });
      box.appendChild(list);
      box.hidden = false;
    }

    try {
      render();
    } catch (e) {
      problems.push("페이지를 그리는 중 문제가 생겼어요 (" + e.message + ")");
    }
    showProblems();
  </script>
</body>
</html>
