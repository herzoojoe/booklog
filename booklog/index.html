<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookLog</title>
  <style>
    :root {
      --primary:    #4a3728;
      --accent:     #b5723a;
      --bg:         #f5f1eb;
      --surface:    #ffffff;
      --border:     #ddd8cf;
      --text:       #2c2018;
      --text-sub:   #7a6e63;
      --star-on:    #e8a020;
      --star-off:   #d8d0c4;
      --danger:     #c0392b;
      --radius-sm:  8px;
      --radius-md:  14px;
      --shadow-sm:  0 1px 4px rgba(0,0,0,0.06);
      --shadow-md:  0 4px 16px rgba(0,0,0,0.10);
      --transition: 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--primary);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title { display: flex; align-items: center; gap: 10px; }
    .header-title .logo { font-size: 26px; line-height: 1; }
    .header-title h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }

    .btn-add {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--transition), transform 0.1s;
    }
    .btn-add:hover  { background: #a0622a; }
    .btn-add:active { transform: scale(0.96); }
    .btn-add .icon  { font-size: 16px; font-style: normal; }

    /* Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* Form section */
    #form-section { display: none; overflow: hidden; margin-bottom: 32px; }
    #form-section.visible { display: block; animation: slideDown 0.22s ease; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 28px 28px 24px;
    }

    .form-card h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--border);
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input[type="text"],
    .form-group input[type="date"],
    .form-group textarea {
      width: 100%;
      padding: 10px 13px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition), background var(--transition);
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--accent); background: #fff; }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .input-error { border-color: var(--danger) !important; }
    .error-msg { font-size: 11px; color: var(--danger); min-height: 16px; }

    /* Star rating — RTL flip: DOM은 r5→r1, 화면은 ★1→★5 */
    .star-rating { display: inline-flex; direction: rtl; gap: 2px; }
    .star-rating input[type="radio"] { display: none; }
    .star-rating label {
      font-size: 28px;
      color: var(--star-off);
      cursor: pointer;
      line-height: 1;
      padding: 2px 3px;
      transition: color 0.1s, transform 0.12s;
      text-transform: none;
      letter-spacing: 0;
    }
    .star-rating label:hover { transform: scale(1.15); }
    .star-rating input:checked + label,
    .star-rating input:checked + label ~ label { color: var(--star-on); }
    .star-rating:hover input:checked + label,
    .star-rating:hover input:checked + label ~ label { color: var(--star-off); }
    .star-rating label:hover,
    .star-rating label:hover ~ label { color: var(--star-on); }

    /* Form actions */
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .btn-cancel {
      padding: 9px 20px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: border-color var(--transition), color var(--transition);
    }
    .btn-cancel:hover { border-color: var(--text-sub); color: var(--text); }

    .btn-save {
      padding: 9px 24px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--transition), transform 0.1s, opacity var(--transition);
    }
    .btn-save:hover   { background: #a0622a; }
    .btn-save:active  { transform: scale(0.97); }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

    /* List */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .list-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .book-count { font-size: 13px; font-weight: 400; color: var(--text-sub); }

    .sort-controls { display: flex; gap: 6px; }

    .btn-sort {
      padding: 6px 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-sort:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sort.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* Card grid — 모바일 1열, 768px+ 2열 */
    .card-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 768px) {
      .card-grid { grid-template-columns: 1fr 1fr; }
    }

    /* Book card */
    .book-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow var(--transition), transform var(--transition);
      animation: fadeUp 0.22s ease;
    }
    .book-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title  { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.35; }

    .btn-delete {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); background: #fdf0ef; }

    .card-author { font-size: 13px; color: var(--text-sub); }
    .card-stars  { font-size: 16px; letter-spacing: 2px; color: var(--star-on); }
    .card-stars .off { color: var(--star-off); }

    .card-memo {
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 8px 12px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 인라인 삭제 확인 */
    .card-confirm {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #fdf0ef;
      border: 1px solid #f5c6c3;
      border-radius: var(--radius-sm);
      animation: fadeUp 0.15s ease;
    }
    .card-confirm span { font-size: 13px; color: var(--danger); font-weight: 600; flex: 1; }
    .btn-confirm-yes, .btn-confirm-no {
      padding: 4px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-confirm-yes { background: var(--danger); color: #fff; }
    .btn-confirm-no  { background: var(--border);  color: var(--text); }

    /* Empty state */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 72px 20px;
      color: var(--text-sub);
    }
    #empty-state.visible { display: flex; }
    .empty-icon { font-size: 58px; margin-bottom: 18px; opacity: 0.7; }
    #empty-state .empty-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    #empty-state .empty-desc  { font-size: 14px; }

    /* Responsive — 520px 이하: 폼 1열 */
    @media (max-width: 520px) {
      .form-card { padding: 20px 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .list-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-title">
        <span class="logo">📚</span>
        <h1>BookLog</h1>
      </div>
      <button class="btn-add" id="btn-add">
        <i class="icon">＋</i> 책 추가
      </button>
    </div>
  </header>

  <div class="container">

    <section id="form-section">
      <div class="form-card">
        <h2>📖 새 책 등록</h2>
        <form id="book-form" novalidate>
          <div class="form-grid">

            <div class="form-group">
              <label for="input-title">책 제목 *</label>
              <input type="text" id="input-title" placeholder="책 제목을 입력하세요" maxlength="50" />
              <span class="error-msg" id="title-error"></span>
            </div>

            <div class="form-group">
              <label for="input-author">저자</label>
              <input type="text" id="input-author" placeholder="저자명을 입력하세요" />
            </div>

            <div class="form-group">
              <label for="input-date">읽은 날짜</label>
              <input type="date" id="input-date" />
            </div>

            <div class="form-group">
              <label>별점 *</label>
              <div class="star-rating" id="star-rating">
                <input type="radio" name="rating" id="r5" value="5" /><label for="r5">★</label>
                <input type="radio" name="rating" id="r4" value="4" /><label for="r4">★</label>
                <input type="radio" name="rating" id="r3" value="3" /><label for="r3">★</label>
                <input type="radio" name="rating" id="r2" value="2" /><label for="r2">★</label>
                <input type="radio" name="rating" id="r1" value="1" /><label for="r1">★</label>
              </div>
            </div>

            <div class="form-group full">
              <label for="input-memo">한 줄 감상</label>
              <textarea id="input-memo" placeholder="책에 대한 짧은 감상을 남겨보세요 (선택)" maxlength="300"></textarea>
            </div>

          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" id="btn-cancel">취소</button>
            <button type="submit" class="btn-save" id="btn-save" disabled>저장하기</button>
          </div>
        </form>
      </div>
    </section>

    <section id="list-section">
      <div class="list-header">
        <h2 class="list-title">
          나의 독서 기록
          <span class="book-count" id="book-count"></span>
        </h2>
        <div class="sort-controls">
          <button class="btn-sort active" data-sort="date">최근 날짜순</button>
          <button class="btn-sort" data-sort="rating">별점순</button>
        </div>
      </div>
      <div class="card-grid" id="card-grid"></div>
    </section>

    <div id="empty-state">
      <div class="empty-icon">📭</div>
      <p class="empty-title">아직 기록된 책이 없어요</p>
      <p class="empty-desc">상단의 '책 추가' 버튼을 눌러<br>첫 번째 독서 기록을 남겨보세요.</p>
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'booklog';
    let _idCounter = 0;

    function loadBooks() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveBooks(books) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
      } catch (e) {
        if (e.name === 'QuotaExceededError' || e.code === 22) {
          alert('저장 공간이 부족합니다. 일부 기록을 삭제한 뒤 다시 시도해 주세요.');
        }
      }
    }

    function addBook(formData) {
      const id    = Date.now() + _idCounter++;
      const books = loadBooks();
      books.unshift({ id, title: formData.title, author: formData.author,
                      date: formData.date, rating: formData.rating, review: formData.review });
      saveBooks(books);
      return id;
    }

    function deleteBook(id) {
      saveBooks(loadBooks().filter(b => b.id !== id));
    }

    function sortBooks(books, mode) {
      return [...books].sort((a, b) => {
        if (mode === 'rating') return (b.rating || 0) - (a.rating || 0);
        if (!a.date && !b.date) return 0;
        if (!a.date) return 1;
        if (!b.date) return -1;
        return b.date.localeCompare(a.date);
      });
    }

    let sortMode = 'date';

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderCards(books) {
      const grid    = document.getElementById('card-grid');
      const empty   = document.getElementById('empty-state');
      const countEl = document.getElementById('book-count');

      if (books.length === 0) {
        grid.innerHTML = '';
        countEl.textContent = '';
        empty.classList.add('visible');
        return;
      }

      empty.classList.remove('visible');
      countEl.textContent = `(${books.length}권)`;

      grid.innerHTML = books.map(book => {
        const starsHtml = book.rating
          ? `<div class="card-stars"><span>${'★'.repeat(book.rating)}</span><span class="off">${'☆'.repeat(5 - book.rating)}</span></div>`
          : '';

        const reviewHtml = book.review
          ? `<p class="card-memo">${escapeHtml(book.review)}</p>`
          : '';

        const dateLabel = book.date
          ? new Date(book.date + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
          : '날짜 미입력';

        return `
          <article class="book-card">
            <div class="card-header">
              <h3 class="card-title">${escapeHtml(book.title)}</h3>
              <button class="btn-delete" data-id="${book.id}" aria-label="삭제">🗑</button>
            </div>
            <p class="card-author">✍️ ${escapeHtml(book.author)}</p>
            ${starsHtml}
            ${reviewHtml}
            <div class="card-footer">📅 ${dateLabel}</div>
          </article>`;
      }).join('');
    }

    function render() {
      renderCards(sortBooks(loadBooks(), sortMode));
    }

    /* DOM 참조 */
    const formSection = document.getElementById('form-section');
    const bookForm    = document.getElementById('book-form');
    const inputTitle  = document.getElementById('input-title');
    const inputAuthor = document.getElementById('input-author');
    const inputDate   = document.getElementById('input-date');
    const inputMemo   = document.getElementById('input-memo');
    const titleError  = document.getElementById('title-error');
    const btnSave     = document.getElementById('btn-save');

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function resetForm() {
      bookForm.reset();
      inputTitle.classList.remove('input-error');
      titleError.textContent = '';
      inputDate.value = today();
      btnSave.disabled = true;
    }

    function validate() {
      inputTitle.classList.remove('input-error');
      titleError.textContent = '';
      if (!inputTitle.value.trim()) {
        inputTitle.classList.add('input-error');
        titleError.textContent = '책 제목을 입력해 주세요.';
        return false;
      }
      return true;
    }

    /* 별점 선택 시 저장 버튼 활성화 */
    document.getElementById('star-rating').addEventListener('change', () => {
      btnSave.disabled = false;
    });

    /* "책 추가" 버튼: 폼 토글 + 오늘 날짜 세팅 */
    document.getElementById('btn-add').addEventListener('click', () => {
      formSection.classList.toggle('visible');
      if (formSection.classList.contains('visible')) {
        inputDate.value = today();
        inputTitle.focus();
      } else {
        resetForm();
      }
    });

    /* 취소 버튼 */
    document.getElementById('btn-cancel').addEventListener('click', () => {
      formSection.classList.remove('visible');
      resetForm();
    });

    /* 폼 저장: addBook → 폼 닫기 → render → 새 카드로 스크롤 */
    bookForm.addEventListener('submit', e => {
      e.preventDefault();
      if (!validate()) return;

      const ratingEl = bookForm.querySelector('input[name="rating"]:checked');
      addBook({
        title:  inputTitle.value.trim(),
        author: inputAuthor.value.trim(),
        date:   inputDate.value,
        rating: ratingEl ? parseInt(ratingEl.value, 10) : 0,
        review: inputMemo.value.trim(),
      });

      formSection.classList.remove('visible');
      resetForm();
      render();

      const firstCard = document.querySelector('.book-card');
      if (firstCard) firstCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    /* 정렬 버튼 */
    document.querySelectorAll('.btn-sort').forEach(btn => {
      btn.addEventListener('click', () => {
        sortMode = btn.dataset.sort;
        render();
        document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    /* 카드 그리드 클릭 위임 — 삭제 / 인라인 확인 처리 */
    document.getElementById('card-grid').addEventListener('click', e => {
      /* 삭제 아이콘 → 인라인 확인 UI 표시 */
      const deleteBtn = e.target.closest('.btn-delete');
      if (deleteBtn) {
        document.querySelectorAll('.card-confirm').forEach(el => el.remove());
        deleteBtn.closest('.book-card').insertAdjacentHTML('beforeend', `
          <div class="card-confirm">
            <span>정말 삭제할까요?</span>
            <button class="btn-confirm-no">취소</button>
            <button class="btn-confirm-yes" data-id="${deleteBtn.dataset.id}">삭제</button>
          </div>`);
        return;
      }

      /* 확인 "삭제" */
      const confirmYes = e.target.closest('.btn-confirm-yes');
      if (confirmYes) {
        deleteBook(Number(confirmYes.dataset.id));
        render();
        return;
      }

      /* 확인 "취소" */
      const confirmNo = e.target.closest('.btn-confirm-no');
      if (confirmNo) {
        confirmNo.closest('.card-confirm').remove();
      }
    });

    render();
  </script>

</body>
</html>
