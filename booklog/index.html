<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookLog</title>
  <style>
    :root {
      --primary:    #4a3728;
      --accent:     #b5723a;
      --bg:         #f5f1eb;
      --surface:    #ffffff;
      --border:     #ddd8cf;
      --text:       #2c2018;
      --text-sub:   #7a6e63;
      --star-on:    #e8a020;
      --star-off:   #d8d0c4;
      --danger:     #c0392b;
      --radius-sm:  8px;
      --radius-md:  14px;
      --shadow-sm:  0 1px 4px rgba(0,0,0,0.06);
      --shadow-md:  0 4px 16px rgba(0,0,0,0.10);
      --transition: 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--primary);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title { display: flex; align-items: center; gap: 10px; }
    .header-title .logo { font-size: 26px; line-height: 1; }
    .header-title h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }

    .btn-add {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--transition), transform 0.1s;
    }
    .btn-add:hover  { background: #a0622a; }
    .btn-add:active { transform: scale(0.96); }
    .btn-add .icon  { font-size: 16px; font-style: normal; }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .btn-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.45);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), transform 0.1s;
    }
    .btn-stats:hover  { background: rgba(255,255,255,0.12); border-color: #fff; }
    .btn-stats:active { transform: scale(0.96); }
    .btn-stats.active { background: #fff; border-color: #fff; color: var(--primary); }

    /* Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* Form section */
    #form-section { display: none; overflow: hidden; margin-bottom: 32px; }
    #form-section.visible { display: block; animation: slideDown 0.22s ease; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 28px 28px 24px;
    }

    .form-card h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--border);
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input[type="text"],
    .form-group input[type="date"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 13px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition), background var(--transition);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); background: #fff; }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .input-error { border-color: var(--danger) !important; }
    .error-msg { font-size: 11px; color: var(--danger); min-height: 16px; }

    /* Star rating — RTL flip: DOM은 r5→r1, 화면은 ★1→★5 */
    .star-rating { display: inline-flex; direction: rtl; gap: 2px; }
    .star-rating input[type="radio"] { display: none; }
    .star-rating label {
      font-size: 28px;
      color: var(--star-off);
      cursor: pointer;
      line-height: 1;
      padding: 2px 3px;
      transition: color 0.1s, transform 0.12s;
      text-transform: none;
      letter-spacing: 0;
    }
    .star-rating label:hover { transform: scale(1.15); }
    .star-rating input:checked + label,
    .star-rating input:checked + label ~ label { color: var(--star-on); }
    .star-rating:hover input:checked + label,
    .star-rating:hover input:checked + label ~ label { color: var(--star-off); }
    .star-rating label:hover,
    .star-rating label:hover ~ label { color: var(--star-on); }

    /* Form actions */
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .btn-cancel {
      padding: 9px 20px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: border-color var(--transition), color var(--transition);
    }
    .btn-cancel:hover { border-color: var(--text-sub); color: var(--text); }

    .btn-save {
      padding: 9px 24px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--transition), transform 0.1s, opacity var(--transition);
    }
    .btn-save:hover   { background: #a0622a; }
    .btn-save:active  { transform: scale(0.97); }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

    /* List */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .list-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .book-count { font-size: 13px; font-weight: 400; color: var(--text-sub); }

    .sort-controls { display: flex; gap: 6px; }

    .btn-sort {
      padding: 6px 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-sort:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sort.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* Card grid — 모바일 1열, 768px+ 2열 */
    .card-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 768px) {
      .card-grid { grid-template-columns: 1fr 1fr; }
    }

    /* Book card */
    .book-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow var(--transition), transform var(--transition);
      animation: fadeUp 0.22s ease;
    }
    .book-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title  { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.35; }

    .btn-delete {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); background: #fdf0ef; }

    .card-author { font-size: 13px; color: var(--text-sub); }
    .card-genre {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .card-stars  { font-size: 16px; letter-spacing: 2px; color: var(--star-on); }
    .card-stars .off { color: var(--star-off); }

    .card-memo {
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 8px 12px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 인라인 삭제 확인 */
    .card-confirm {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #fdf0ef;
      border: 1px solid #f5c6c3;
      border-radius: var(--radius-sm);
      animation: fadeUp 0.15s ease;
    }
    .card-confirm span { font-size: 13px; color: var(--danger); font-weight: 600; flex: 1; }
    .btn-confirm-yes, .btn-confirm-no {
      padding: 4px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-confirm-yes { background: var(--danger); color: #fff; }
    .btn-confirm-no  { background: var(--border);  color: var(--text); }

    /* Empty state */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 72px 20px;
      color: var(--text-sub);
    }
    #empty-state.visible { display: flex; }
    .empty-icon { font-size: 58px; margin-bottom: 18px; opacity: 0.7; }
    #empty-state .empty-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    #empty-state .empty-desc  { font-size: 14px; }

    /* 통계 화면 — 통계 모드에서는 폼·목록·빈 화면을 숨기고 통계만 표시 */
    #stats-section { display: none; }
    .container.stats-mode #stats-section { display: block; animation: fadeUp 0.22s ease; }
    .container.stats-mode #form-section,
    .container.stats-mode #list-section,
    .container.stats-mode #empty-state { display: none; }

    .stats-header { margin-bottom: 18px; }
    .stats-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 768px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 20px;
    }
    .stat-card.full { grid-column: 1 / -1; }
    .stat-card h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .stat-note { font-size: 12px; color: var(--text-sub); margin-top: 10px; }

    .stat-hero { display: flex; align-items: baseline; gap: 6px; color: var(--primary); }
    .stat-hero .num  { font-size: 48px; font-weight: 700; line-height: 1.1; letter-spacing: -1px; }
    .stat-hero .unit { font-size: 18px; font-weight: 600; }

    /* 장르 Top 3 */
    .genre-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .genre-row  { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 4px 10px; }
    .genre-rank { font-size: 14px; font-weight: 700; color: var(--accent); }
    .genre-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .genre-count { font-size: 13px; color: var(--text-sub); }
    .genre-track { grid-column: 2 / -1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .genre-fill  { height: 100%; background: var(--accent); border-radius: 4px; }
    .stat-empty  { font-size: 14px; color: var(--text-sub); padding: 8px 0; }

    /* 월별 막대그래프 */
    .month-chart {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
      height: 180px;
      align-items: end;
      border-bottom: 1.5px solid var(--border);
      padding-top: 22px;
    }
    .month-col {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      outline: none;
    }
    .month-bar {
      width: 100%;
      max-width: 36px;
      background: var(--accent);
      border-radius: 4px 4px 0 0;
      transition: background var(--transition);
    }
    .month-col:hover .month-bar,
    .month-col:focus .month-bar { background: var(--primary); }
    .month-value { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .month-col[data-tip]:hover::after,
    .month-col[data-tip]:focus::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 4px 10px;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      border-radius: 6px;
      box-shadow: var(--shadow-md);
      pointer-events: none;
      z-index: 2;
    }
    .month-labels { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; margin-top: 6px; }
    .month-labels span { text-align: center; font-size: 12px; color: var(--text-sub); white-space: nowrap; }
    .month-labels span.current { color: var(--accent); font-weight: 700; }

    /* Responsive — 520px 이하: 폼 1열 */
    @media (max-width: 520px) {
      .form-card { padding: 20px 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .list-header { flex-direction: column; align-items: flex-start; }
      .month-chart, .month-labels { gap: 3px; }
      .month-labels span { font-size: 10px; letter-spacing: -0.5px; }
      .btn-stats, .btn-add { padding: 7px 11px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-title">
        <span class="logo">📚</span>
        <h1>BookLog</h1>
      </div>
      <div class="header-actions">
        <button class="btn-stats" id="btn-stats" aria-pressed="false">
          📊 통계
        </button>
        <button class="btn-add" id="btn-add">
          <i class="icon">＋</i> 책 추가
        </button>
      </div>
    </div>
  </header>

  <div class="container">

    <section id="form-section">
      <div class="form-card">
        <h2>📖 새 책 등록</h2>
        <form id="book-form" novalidate>
          <div class="form-grid">

            <div class="form-group">
              <label for="input-title">책 제목 *</label>
              <input type="text" id="input-title" placeholder="책 제목을 입력하세요" maxlength="50" />
              <span class="error-msg" id="title-error"></span>
            </div>

            <div class="form-group">
              <label for="input-author">저자</label>
              <input type="text" id="input-author" placeholder="저자명을 입력하세요" />
            </div>

            <div class="form-group">
              <label for="input-date">읽은 날짜</label>
              <input type="date" id="input-date" />
            </div>

            <div class="form-group">
              <label for="input-genre">장르</label>
              <select id="input-genre">
                <option value="">선택 안 함</option>
              </select>
            </div>

            <div class="form-group">
              <label>별점 *</label>
              <div class="star-rating" id="star-rating">
                <input type="radio" name="rating" id="r5" value="5" /><label for="r5">★</label>
                <input type="radio" name="rating" id="r4" value="4" /><label for="r4">★</label>
                <input type="radio" name="rating" id="r3" value="3" /><label for="r3">★</label>
                <input type="radio" name="rating" id="r2" value="2" /><label for="r2">★</label>
                <input type="radio" name="rating" id="r1" value="1" /><label for="r1">★</label>
              </div>
            </div>

            <div class="form-group full">
              <label for="input-memo">한 줄 감상</label>
              <textarea id="input-memo" placeholder="책에 대한 짧은 감상을 남겨보세요 (선택)" maxlength="300"></textarea>
            </div>

          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" id="btn-cancel">취소</button>
            <button type="submit" class="btn-save" id="btn-save" disabled>저장하기</button>
          </div>
        </form>
      </div>
    </section>

    <section id="list-section">
      <div class="list-header">
        <h2 class="list-title">
          나의 독서 기록
          <span class="book-count" id="book-count"></span>
        </h2>
        <div class="sort-controls">
          <button class="btn-sort active" data-sort="date">최근 날짜순</button>
          <button class="btn-sort" data-sort="rating">별점순</button>
        </div>
      </div>
      <div class="card-grid" id="card-grid"></div>
    </section>

    <div id="empty-state">
      <div class="empty-icon">📭</div>
      <p class="empty-title">아직 기록된 책이 없어요</p>
      <p class="empty-desc">상단의 '책 추가' 버튼을 눌러<br>첫 번째 독서 기록을 남겨보세요.</p>
    </div>

    <section id="stats-section">
      <div class="stats-header">
        <h2 class="list-title">📊 <span><span id="stats-year"></span>년 독서 통계</span></h2>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <h3>올해 읽은 책</h3>
          <div class="stat-hero"><span class="num" id="stat-year-count">0</span><span class="unit">권</span></div>
          <p class="stat-note" id="stat-year-note"></p>
        </div>
        <div class="stat-card">
          <h3>가장 많이 읽은 장르 Top 3</h3>
          <div id="stat-genres"></div>
          <p class="stat-note" id="stat-genre-note"></p>
        </div>
        <div class="stat-card full">
          <h3>월별 읽은 권수</h3>
          <div class="month-chart" id="month-chart" role="img"></div>
          <div class="month-labels" id="month-labels"></div>
        </div>
      </div>
    </section>

  </div>

  <script>
    const STORAGE_KEY = 'booklog';
    let _idCounter = 0;

    function loadBooks() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveBooks(books) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
      } catch (e) {
        if (e.name === 'QuotaExceededError' || e.code === 22) {
          alert('저장 공간이 부족합니다. 일부 기록을 삭제한 뒤 다시 시도해 주세요.');
        }
      }
    }

    function addBook(formData) {
      const id    = Date.now() + _idCounter++;
      const books = loadBooks();
      books.unshift({ id, title: formData.title, author: formData.author,
                      date: formData.date, rating: formData.rating, review: formData.review,
                      genre: formData.genre });
      saveBooks(books);
      return id;
    }

    function deleteBook(id) {
      saveBooks(loadBooks().filter(b => b.id !== id));
    }

    function sortBooks(books, mode) {
      return [...books].sort((a, b) => {
        if (mode === 'rating') return (b.rating || 0) - (a.rating || 0);
        if (!a.date && !b.date) return 0;
        if (!a.date) return 1;
        if (!b.date) return -1;
        return b.date.localeCompare(a.date);
      });
    }

    let sortMode = 'date';

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderCards(books) {
      const grid    = document.getElementById('card-grid');
      const empty   = document.getElementById('empty-state');
      const countEl = document.getElementById('book-count');

      if (books.length === 0) {
        grid.innerHTML = '';
        countEl.textContent = '';
        empty.classList.add('visible');
        return;
      }

      empty.classList.remove('visible');
      countEl.textContent = `(${books.length}권)`;

      grid.innerHTML = books.map(book => {
        const starsHtml = book.rating
          ? `<div class="card-stars"><span>${'★'.repeat(book.rating)}</span><span class="off">${'☆'.repeat(5 - book.rating)}</span></div>`
          : '';

        const reviewHtml = book.review
          ? `<p class="card-memo">${escapeHtml(book.review)}</p>`
          : '';

        const dateLabel = book.date
          ? new Date(book.date + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
          : '날짜 미입력';

        return `
          <article class="book-card">
            <div class="card-header">
              <h3 class="card-title">${escapeHtml(book.title)}</h3>
              <button class="btn-delete" data-id="${book.id}" aria-label="삭제">🗑</button>
            </div>
            <p class="card-author">✍️ ${escapeHtml(book.author)}${book.genre ? `<span class="card-genre">${escapeHtml(book.genre)}</span>` : ''}</p>
            ${starsHtml}
            ${reviewHtml}
            <div class="card-footer">📅 ${dateLabel}</div>
          </article>`;
      }).join('');
    }

    function render() {
      renderCards(sortBooks(loadBooks(), sortMode));
    }

    /* DOM 참조 */
    const formSection = document.getElementById('form-section');
    const bookForm    = document.getElementById('book-form');
    const inputTitle  = document.getElementById('input-title');
    const inputAuthor = document.getElementById('input-author');
    const inputDate   = document.getElementById('input-date');
    const inputGenre  = document.getElementById('input-genre');
    const inputMemo   = document.getElementById('input-memo');
    const titleError  = document.getElementById('title-error');
    const btnSave     = document.getElementById('btn-save');

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function resetForm() {
      bookForm.reset();
      inputTitle.classList.remove('input-error');
      titleError.textContent = '';
      inputDate.value = today();
      btnSave.disabled = true;
    }

    function validate() {
      inputTitle.classList.remove('input-error');
      titleError.textContent = '';
      if (!inputTitle.value.trim()) {
        inputTitle.classList.add('input-error');
        titleError.textContent = '책 제목을 입력해 주세요.';
        return false;
      }
      return true;
    }

    /* 별점 선택 시 저장 버튼 활성화 */
    document.getElementById('star-rating').addEventListener('change', () => {
      btnSave.disabled = false;
    });

    /* "책 추가" 버튼: 폼 토글 + 오늘 날짜 세팅 */
    document.getElementById('btn-add').addEventListener('click', () => {
      if (container.classList.contains('stats-mode')) {
        showStats(false);
        formSection.classList.remove('visible');
      }
      formSection.classList.toggle('visible');
      if (formSection.classList.contains('visible')) {
        inputDate.value = today();
        inputTitle.focus();
      } else {
        resetForm();
      }
    });

    /* 취소 버튼 */
    document.getElementById('btn-cancel').addEventListener('click', () => {
      formSection.classList.remove('visible');
      resetForm();
    });

    /* 폼 저장: addBook → 폼 닫기 → render → 새 카드로 스크롤 */
    bookForm.addEventListener('submit', e => {
      e.preventDefault();
      if (!validate()) return;

      const ratingEl = bookForm.querySelector('input[name="rating"]:checked');
      addBook({
        title:  inputTitle.value.trim(),
        author: inputAuthor.value.trim(),
        date:   inputDate.value,
        rating: ratingEl ? parseInt(ratingEl.value, 10) : 0,
        review: inputMemo.value.trim(),
        genre:  inputGenre.value,
      });

      formSection.classList.remove('visible');
      resetForm();
      render();

      const firstCard = document.querySelector('.book-card');
      if (firstCard) firstCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    /* 정렬 버튼 */
    document.querySelectorAll('.btn-sort').forEach(btn => {
      btn.addEventListener('click', () => {
        sortMode = btn.dataset.sort;
        render();
        document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    /* 카드 그리드 클릭 위임 — 삭제 / 인라인 확인 처리 */
    document.getElementById('card-grid').addEventListener('click', e => {
      /* 삭제 아이콘 → 인라인 확인 UI 표시 */
      const deleteBtn = e.target.closest('.btn-delete');
      if (deleteBtn) {
        document.querySelectorAll('.card-confirm').forEach(el => el.remove());
        deleteBtn.closest('.book-card').insertAdjacentHTML('beforeend', `
          <div class="card-confirm">
            <span>정말 삭제할까요?</span>
            <button class="btn-confirm-no">취소</button>
            <button class="btn-confirm-yes" data-id="${deleteBtn.dataset.id}">삭제</button>
          </div>`);
        return;
      }

      /* 확인 "삭제" */
      const confirmYes = e.target.closest('.btn-confirm-yes');
      if (confirmYes) {
        deleteBook(Number(confirmYes.dataset.id));
        render();
        return;
      }

      /* 확인 "취소" */
      const confirmNo = e.target.closest('.btn-confirm-no');
      if (confirmNo) {
        confirmNo.closest('.card-confirm').remove();
      }
    });

    /* ───────── 독서 통계 ───────── */
    const GENRES = ['소설', '에세이', '시', '인문', '역사', '자기계발', '경제·경영', '과학', '예술', '만화', '기타'];
    inputGenre.insertAdjacentHTML('beforeend',
      GENRES.map(g => `<option value="${g}">${g}</option>`).join(''));

    const container = document.querySelector('.container');
    const btnStats  = document.getElementById('btn-stats');

    /* "읽은 책" = 읽은 날짜가 있는 기록. 월별·올해 집계는 읽은 날짜 기준 */
    function computeStats(books, year) {
      const monthly = Array(12).fill(0);
      let undated = 0;
      books.forEach(b => {
        if (!b.date) { undated++; return; }
        const [y, m] = b.date.split('-').map(Number);
        if (y === year) monthly[m - 1]++;
      });

      /* 장르 Top 3는 전체 기록 기준. 동점이면 장르 목록 순서 */
      const genreCount = new Map();
      let noGenre = 0;
      books.forEach(b => {
        if (b.genre) genreCount.set(b.genre, (genreCount.get(b.genre) || 0) + 1);
        else noGenre++;
      });
      const order = g => { const i = GENRES.indexOf(g); return i < 0 ? GENRES.length : i; };
      const topGenres = [...genreCount]
        .sort((a, b) => b[1] - a[1] || order(a[0]) - order(b[0]))
        .slice(0, 3);

      return { monthly, yearCount: monthly.reduce((s, n) => s + n, 0), undated, topGenres, noGenre };
    }

    function renderStats() {
      const books = loadBooks();
      const now   = new Date();
      const year  = now.getFullYear();
      const st    = computeStats(books, year);

      document.getElementById('stats-year').textContent = year;
      document.getElementById('stat-year-count').textContent = st.yearCount;
      document.getElementById('stat-year-note').textContent =
        `전체 기록 ${books.length}권 중 읽은 날짜가 ${year}년인 책` +
        (st.undated ? ` · 날짜 미입력 ${st.undated}권 제외` : '');

      /* 장르 Top 3 */
      const genresEl = document.getElementById('stat-genres');
      if (st.topGenres.length === 0) {
        genresEl.innerHTML = '<p class="stat-empty">아직 장르가 입력된 책이 없어요.<br>책을 추가할 때 장르를 선택해 보세요.</p>';
      } else {
        const max = st.topGenres[0][1];
        genresEl.innerHTML = `<ol class="genre-list">${st.topGenres.map(([g, n], i) => `
          <li class="genre-row">
            <span class="genre-rank">${i + 1}</span>
            <span class="genre-name">${escapeHtml(g)}</span>
            <span class="genre-count">${n}권</span>
            <div class="genre-track"><div class="genre-fill" style="width:${(n / max) * 100}%"></div></div>
          </li>`).join('')}</ol>`;
      }
      document.getElementById('stat-genre-note').textContent =
        '전체 기록 기준' + (st.noGenre ? ` · 장르 미입력 ${st.noGenre}권 제외` : '');

      /* 월별 막대그래프 — 막대 높이는 가장 많이 읽은 달을 100%로 */
      const maxMonth = Math.max(...st.monthly, 1);
      const chart = document.getElementById('month-chart');
      chart.innerHTML = st.monthly.map((n, i) => n
        ? `<div class="month-col" tabindex="0" data-tip="${i + 1}월 · ${n}권">
             <span class="month-value">${n}</span>
             <div class="month-bar" style="height:${(n / maxMonth) * 100}%"></div>
           </div>`
        : `<div class="month-col"></div>`).join('');
      chart.setAttribute('aria-label',
        `${year}년 월별 읽은 권수: ` + st.monthly.map((n, i) => `${i + 1}월 ${n}권`).join(', '));
      document.getElementById('month-labels').innerHTML = st.monthly.map((_, i) =>
        `<span class="${i === now.getMonth() ? 'current' : ''}">${i + 1}월</span>`).join('');
    }

    function showStats(on) {
      container.classList.toggle('stats-mode', on);
      btnStats.classList.toggle('active', on);
      btnStats.setAttribute('aria-pressed', String(on));
      if (on) renderStats();
    }

    /* "통계" 버튼: 통계 화면 ↔ 목록 화면 전환 */
    btnStats.addEventListener('click', () => {
      showStats(!container.classList.contains('stats-mode'));
    });

    render();
  </script>

</body>
</html>
